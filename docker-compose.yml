version: "3.9"

services:
  backend:
    container_name: lab_inventory_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - lab_inventory_net
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/lab_inventory
      SECRET_KEY: "twoj-sekret"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_USER: "lab.inventory.reset@gmail.com"
      SMTP_PASSWORD: "lhkxutallrdhnznp"
      FRONTEND_URL: "http://10.19.145.15:5173"

  frontend:
    container_name: lab_inventory_frontend
    build:
      context: ./lab-inventory-ui
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    networks:
      - lab_inventory_net

  db:
    container_name: lab_inventory_db
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lab_inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lab_inventory_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

networks:
  lab_inventory_net:
